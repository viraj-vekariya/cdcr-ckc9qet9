<meta charset="utf-8">
<title>CDC Radar</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --accent:#1e2a63; --accent-contrast:#ffffff; --gold:#b8892c;
  --bg:#f7f6f1; --surface:#ffffff; --surface-2:#efece3; --border:#e2ded2;
  --text:#1b1b1f; --text-dim:#67646c;
  --good:#1f7a4d; --good-bg:#e6f4ec;
  --info:#2452c8; --info-bg:#e9eefc;
  --warn:#a8660a; --warn-bg:#fbeed7;
  --shadow:0 1px 2px rgba(20,20,30,.04), 0 6px 20px -8px rgba(20,20,30,.10);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --accent:#93a4ff; --accent-contrast:#10142c; --gold:#e3b854;
    --bg:#12141d; --surface:#1a1d29; --surface-2:#212437; --border:#2b2e40;
    --text:#eceefc; --text-dim:#9c9db3;
    --good:#5fd39a; --good-bg:#123321;
    --info:#9db3ff; --info-bg:#1a2247;
    --warn:#f0b967; --warn-bg:#3a2b0f;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 24px -8px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --accent:#93a4ff; --accent-contrast:#10142c; --gold:#e3b854;
  --bg:#12141d; --surface:#1a1d29; --surface-2:#212437; --border:#2b2e40;
  --text:#eceefc; --text-dim:#9c9db3;
  --good:#5fd39a; --good-bg:#123321;
  --info:#9db3ff; --info-bg:#1a2247;
  --warn:#f0b967; --warn-bg:#3a2b0f;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 24px -8px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:"IBM Plex Sans",-apple-system,sans-serif;padding-inline:16px;padding-block:22px 60px;max-width:1220px;margin:0 auto}#noticesSection{max-width:880px;margin:0 auto}
h1,h2,h3{font-family:"Fraunces",Georgia,serif;text-wrap:balance;margin:0}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px 14px;margin-bottom:14px;border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{font-size:26px;font-weight:700;color:var(--accent)}
.brand .inst{font-size:12.5px;color:var(--text-dim);letter-spacing:.02em}
.subrow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px;flex-wrap:wrap}
.updated{font-size:12px;color:var(--text-dim)}
.updated b{color:var(--text)}
button.refresh{font:600 12.5px "IBM Plex Sans",sans-serif;color:var(--accent);background:var(--surface-2);border:1px solid var(--border);border-radius:7px;padding:6px 11px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
button.refresh:hover{border-color:var(--accent)}
button.refresh svg{width:13px;height:13px}
button.refresh.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.tabs{display:flex;gap:4px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:4px;margin-bottom:14px;overflow-x:auto}
.tab{flex:1 0 auto;text-align:center;font:600 12.5px "IBM Plex Sans";color:var(--text-dim);padding:7px 10px;border-radius:7px;cursor:pointer;white-space:nowrap;background:transparent;border:none}
.tab[aria-selected="true"]{background:var(--surface);color:var(--accent);box-shadow:var(--shadow)}
.tab .cnt{opacity:.7;font-family:"IBM Plex Mono";margin-left:3px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}.cv-links{display:flex;gap:8px}.cv-links a{font:600 12.5px "IBM Plex Sans";color:var(--accent);background:var(--surface-2);border:1px solid var(--border);border-radius:7px;padding:6px 12px;text-decoration:none}.cv-links a:hover{border-color:var(--accent)}.toolbar-right{display:flex;align-items:center;gap:18px;flex-wrap:wrap}.toolbar-right .toggle-row{margin-bottom:0}.intern-link{font:600 12.5px "IBM Plex Sans";color:var(--accent);text-decoration:none;white-space:nowrap}

.toggle-row{display:flex;align-items:center;gap:8px;margin-bottom:12px;font-size:13px;color:var(--text-dim)}
.toggle-row input{width:15px;height:15px;accent-color:var(--accent)}
.toggle-row label{cursor:pointer;user-select:none}

.searchwrap{position:relative;margin-bottom:10px}
input.search{width:100%;font:14px "IBM Plex Sans";padding:10px 12px 10px 34px;border-radius:9px;border:1px solid var(--border);background:var(--surface);color:var(--text)}
input.search:focus{outline:2px solid var(--accent);outline-offset:-1px}
.searchwrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--text-dim)}

.subjectrow{margin-bottom:16px}
select.subjectSelect{font:600 12.5px "IBM Plex Sans";color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:7px 10px;width:100%}
select.subjectSelect:focus{outline:2px solid var(--accent);outline-offset:-1px}

.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:13px 15px;box-shadow:var(--shadow)}
.card .hd{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;margin-bottom:6px;flex-wrap:wrap}
.badges{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.badge{font:700 10.5px "IBM Plex Sans";text-transform:uppercase;letter-spacing:.03em;padding:2px 7px;border-radius:5px}
.badge.PLACEMENT{background:var(--good-bg);color:var(--good)}
.badge.INTERNSHIP{background:var(--info-bg);color:var(--info)}
.badge.subj{background:var(--warn-bg);color:var(--warn)}
.badge.new{background:var(--gold);color:#241a00}
.time{font-size:11.5px;color:var(--text-dim);font-family:"IBM Plex Mono";white-space:nowrap}
.co{font-weight:600;font-size:14.5px;margin-bottom:5px}
.co.empty{color:var(--text-dim);font-weight:400;font-style:italic}
.body{font-size:13px;line-height:1.55;color:var(--text);white-space:pre-wrap;max-height:96px;overflow:hidden;position:relative}
.body.open{max-height:none}
.body:not(.open)::after{content:"";position:absolute;bottom:0;left:0;right:0;height:34px;background:linear-gradient(transparent,var(--surface))}
.body a{overflow-wrap:anywhere}
.more{margin-top:6px;font:600 12px "IBM Plex Sans";color:var(--accent);background:none;border:none;cursor:pointer;padding:0}
.dl{text-decoration:none;margin-top:8px;font-size:12px;display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:6px}
.dl.yes{background:var(--good-bg);color:var(--good)}
.dl.no{background:var(--surface-2);color:var(--text-dim)}

.loadmore{display:block;margin:16px auto 0;font:600 13px "IBM Plex Sans";color:var(--accent-contrast);background:var(--accent);border:none;border-radius:9px;padding:10px 18px;cursor:pointer}
.empty-state{text-align:center;color:var(--text-dim);padding:40px 10px;font-size:13.5px}
.err{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:12px 14px;font-size:13px;margin-bottom:14px}
footer{margin-top:34px;padding-top:16px;border-top:1px solid var(--border);font-size:11.5px;color:var(--text-dim);text-align:center;line-height:1.6}
footer a{color:var(--accent)}
.skel{background:linear-gradient(90deg,var(--surface-2) 25%,var(--border) 37%,var(--surface-2) 63%);background-size:400% 100%;animation:sh 1.4s ease infinite;border-radius:12px;height:88px}
@keyframes sh{0%{background-position:100% 0}100%{background-position:0 0}}

#jobsUpdated{color:var(--text-dim);font-size:13px;margin:0 0 12px}
.status-pill{padding:5px 10px;border-radius:20px;font:600 11.5px "IBM Plex Sans";white-space:nowrap;display:inline-block}
.status-applied{background:var(--good-bg);color:var(--good)}
.status-available{background:var(--info-bg);color:var(--info)}
.status-loading{background:var(--surface-2);color:var(--text-dim)}
.opp-table{width:100%;border-collapse:collapse;font-size:13px}
.opp-table th{text-align:left;font:600 10.5px "IBM Plex Sans";text-transform:uppercase;letter-spacing:.04em;color:var(--text-dim);padding:8px 10px;border-bottom:2px solid var(--border);white-space:nowrap}
.opp-table td{padding:10px;border-bottom:1px solid var(--border);vertical-align:top}
.opp-table tr.opp-row:hover{background:var(--surface-2)}
.opp-company{font:700 14px "Fraunces",Georgia,serif;margin:0}
.opp-role{color:var(--text-dim);font-size:12.5px;margin:2px 0 0}
.opp-toggle-btn{font:600 12px "IBM Plex Sans";color:var(--accent);background:none;border:1px solid var(--border);border-radius:6px;padding:5px 10px;cursor:pointer;white-space:nowrap}
.opp-detail-row td{background:var(--surface-2)}
.opp-detail{padding:6px 2px}
.opp-desc{font-size:13.5px;line-height:1.6;color:var(--text);white-space:pre-wrap}
.opp-eligibility-note{font-size:13px;color:var(--text-dim);margin-top:10px}
.opp-detail details{margin-top:10px;border-top:1px solid var(--border);padding-top:10px}
.opp-detail summary{cursor:pointer;font-weight:600;font-size:13px}
.opp-detail pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;line-height:1.6;font-size:12.5px;color:var(--text-dim);max-height:260px;overflow:auto;margin:8px 0 0;padding:8px;background:var(--surface);border-radius:8px}
.opp-open{display:inline-block;margin-top:12px;font:600 13px "IBM Plex Sans";color:var(--accent-contrast);background:var(--accent);padding:8px 14px;border-radius:8px;text-decoration:none}.opp-table-wrap{overflow-x:auto}.opp-global-open{display:inline-block;margin:2px 0 16px;font:600 13px "IBM Plex Sans";color:var(--accent-contrast);background:var(--accent);padding:9px 16px;border-radius:8px;text-decoration:none}
.source-note{font-size:12px;color:var(--text-dim);margin-top:12px}
</style>

<header class="top">
  <div class="brand">
    <h1>CDC Radar</h1>
    <span class="inst">IIT Kharagpur &middot; Career Development Centre</span>
  </div>
  <div class="subrow">
    <div class="updated">Updated <b id="updatedAt">&hellip;</b></div>
    <button class="refresh" id="refreshBtn" title="Refresh now">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-3-6.7M21 3v6h-6"/></svg>
      Refresh
    </button>
  </div>
</header>

<div class="toolbar">
  <div class="cv-links">
    <a href="./cvs/CV1.pdf" target="_blank" rel="noopener">CV1</a>
    <a href="./cvs/CV2.pdf" target="_blank" rel="noopener">CV2</a>
    <a href="./cvs/CV3.pdf" target="_blank" rel="noopener">CV3</a>
  </div>
  <div class="toolbar-right">
    <div class="toggle-row">
      <input type="checkbox" id="ppoToggle">
      <label for="ppoToggle">Show PPO notices</label>
    </div>
    <a class="intern-link" href="./internship.html">Internship notices &rarr;</a>
  </div>
</div>

<div class="tabs" role="tablist" id="sectionTabs"></div>

<section id="noticesSection">
  <div class="searchwrap">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    <input class="search" id="search" placeholder="Search by company or keyword&hellip;" autocomplete="off">
  </div>

  <div class="subjectrow">
    <select class="subjectSelect" id="subjectFilter"></select>
  </div>

  <div id="errBox"></div>
  <div class="list" id="list"></div>
  <button class="loadmore" id="loadMore" hidden>Show more</button>
</section>

<section id="opportunitiesSection" hidden>
  <p id="jobsUpdated">Loading latest company snapshot&hellip;</p>
  <div id="jobsTableWrap"></div>
</section>

<footer>
  Placement notices auto-scraped hourly from the IIT KGP ERP CDC Notice board.<br>
  Source: <a href="./notices.json" target="_blank" rel="noopener">notices.json</a>
  on <a href="https://github.com/viraj-vekariya/placement-watcher" target="_blank" rel="noopener">placement-watcher</a>
</footer>

<script>
(function(){
  "use strict";
  var DATA_URL = "./notices.json";
  var PAGE_SIZE = 40;
  var SECTION_TABS = [
    {key:"notices", label:"Placement"},
    {key:"opportunities", label:"Placement Opportunity"}
  ];
  var state = { data:null, jobsData:null, section:"notices", query:"", subject:"", showPPO:false, shown:PAGE_SIZE, lastSeenId:0 };

  function esc(s){
    return String(s==null?"":s).replace(/[&<>"']/g,function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function linkify(s){
    var text = String(s || ''), out = '', cursor = 0;
    var re = /https?:\/\/[^\s<>"']+/g, m;
    while ((m = re.exec(text))) {
      out += esc(text.slice(cursor, m.index));
      var url = m[0], tail = '';
      while (/[.,;!]$/.test(url)) { tail = url.slice(-1) + tail; url = url.slice(0,-1); }
      out += '<a href="'+esc(url)+'" target="_blank" rel="noopener noreferrer">'+esc(url)+'</a>'+esc(tail);
      cursor = m.index + m[0].length;
    }
    return out + esc(text.slice(cursor));
  }
  function safeStore(fn,fallback){ try{ return fn(); }catch(e){ return fallback; } }

  function loadLastSeen(){
    return safeStore(function(){ return parseInt(localStorage.getItem("cdcRadarLastSeenId")||"0",10) || 0; }, 0);
  }
  function saveLastSeen(id){
    safeStore(function(){ localStorage.setItem("cdcRadarLastSeenId", String(id)); }, null);
  }

  function relTime(iso){
    var d = new Date(iso);
    if(isNaN(d)) return iso;
    var mins = Math.round((Date.now()-d.getTime())/60000);
    if(mins < 1) return "just now";
    if(mins < 60) return mins + "m ago";
    var hrs = Math.round(mins/60);
    if(hrs < 24) return hrs + "h ago";
    var days = Math.round(hrs/24);
    return days + "d ago";
  }

  function isToday(noticeat){
    var parts = (noticeat||"").split(" ")[0].split("-");
    if(parts.length !== 3) return false;
    var d = parseInt(parts[0],10), m = parseInt(parts[1],10), y = parseInt(parts[2],10);
    var now = new Date();
    return d===now.getDate() && m===(now.getMonth()+1) && y===now.getFullYear();
  }

  function renderSectionTabs(){
    var el = document.getElementById("sectionTabs");
    el.innerHTML = SECTION_TABS.map(function(t){
      var sel = t.key===state.section;
      return '<button class="tab" role="tab" aria-selected="'+sel+'" data-section="'+t.key+'">'+esc(t.label)+'</button>';
    }).join("");
    Array.prototype.forEach.call(el.querySelectorAll(".tab"), function(btn){
      btn.addEventListener("click", function(){
        state.section = btn.getAttribute("data-section");
        renderSectionTabs();
        document.getElementById("noticesSection").hidden = state.section !== "notices";
        document.getElementById("opportunitiesSection").hidden = state.section !== "opportunities";
      });
    });
  }

  // Placement-only notices on this page (internship notices live on their
  // own page, ./internship.html, per explicit request). PPO is hidden by
  // default via a dedicated toggle -- separate from the general subject
  // dropdown, which still covers every other subject.
  function placementRows(){
    return (state.data && state.data.categories.placement) || [];
  }

  function renderSubjectFilter(){
    var rows = placementRows().filter(function(r){ return state.showPPO || (r.subject||"").toUpperCase() !== "PPO"; });
    var subjects = [];
    rows.forEach(function(r){
      var s = r.subject || "";
      if(s && subjects.indexOf(s) === -1) subjects.push(s);
    });
    subjects.sort();
    var sel = document.getElementById("subjectFilter");
    var opts = ['<option value="">All subjects</option>'].concat(
      subjects.map(function(s){
        return '<option value="'+esc(s)+'"'+(s===state.subject?' selected':'')+'>'+esc(s)+'</option>';
      })
    );
    sel.innerHTML = opts.join("");
    if(subjects.indexOf(state.subject) === -1) { state.subject = ""; sel.value = ""; }
  }

  function filtered(){
    var rows = placementRows();
    if(!state.showPPO){
      rows = rows.filter(function(r){ return (r.subject||"").toUpperCase() !== "PPO"; });
    }
    if(state.subject){
      rows = rows.filter(function(r){ return (r.subject||"") === state.subject; });
    }
    var q = state.query.trim().toLowerCase();
    if(!q) return rows;
    return rows.filter(function(r){
      return (r.company||"").toLowerCase().indexOf(q) > -1 ||
             (r.notice||"").toLowerCase().indexOf(q) > -1 ||
             (r.subject||"").toLowerCase().indexOf(q) > -1;
    });
  }

  function cardHtml(r){
    var idNum = parseInt(r.id,10) || 0;
    var isNew = idNum > state.lastSeenId;
    var badges = '<span class="badge '+esc(r.type)+'">'+esc(r.type)+'</span>' +
                 (r.subject ? '<span class="badge subj">'+esc(r.subject)+'</span>' : '') +
                 (isNew ? '<span class="badge new">New</span>' : '') +
                 (isToday(r.noticeat) ? '<span class="badge subj" style="background:var(--info-bg);color:var(--info)">Today</span>' : '');
    var dl = "";
    if(r.file){
      dl = '<a class="dl yes" href="'+esc(r.file)+'" target="_blank" rel="noopener">&#128206; Download attached file (PDF)</a>';
    } else if(r.has_download){
      dl = '<div class="dl no">Attachment listed on ERP &mdash; download pending or unavailable</div>';
    }
    return '<div class="card" data-id="'+esc(r.id)+'">' +
      '<div class="hd"><div class="badges">'+badges+'</div><div class="time">'+esc(r.noticeat)+'</div></div>' +
      '<div class="co'+(r.company?'':' empty')+'">'+esc(r.company||"General notice (no company)")+'</div>' +
      '<div class="body">'+linkify(r.notice)+'</div>' +
      '<button class="more">Read full notice</button>' +
      '<div class="source-note">'+(r.text_source === 'full_notice' ? 'Full ERP notice &middot; original wording' : 'ERP grid text &middot; full detail pending')+'</div>' +
      dl +
    '</div>';
  }

  function renderList(){
    var rows = filtered();
    var list = document.getElementById("list");
    var maxIdSeen = state.lastSeenId;

    if(rows.length === 0){
      list.innerHTML = '<div class="empty-state">No notices match&nbsp;&mdash;&nbsp;try a different search or filter.</div>';
      document.getElementById("loadMore").hidden = true;
      return;
    }

    var slice = rows.slice(0, state.shown);
    list.innerHTML = slice.map(cardHtml).join("");

    rows.forEach(function(r){
      var idNum = parseInt(r.id,10) || 0;
      if(idNum > maxIdSeen) maxIdSeen = idNum;
    });

    Array.prototype.forEach.call(list.querySelectorAll(".more"), function(btn){
      btn.addEventListener("click", function(){
        var body = btn.previousElementSibling;
        var open = body.classList.toggle("open");
        btn.textContent = open ? "Show less" : "Show more";
      });
    });

    var lm = document.getElementById("loadMore");
    lm.hidden = rows.length <= state.shown;

    clearTimeout(renderList._t);
    renderList._t = setTimeout(function(){ saveLastSeen(maxIdSeen); }, 4000);
  }

  function showError(msg){
    document.getElementById("errBox").innerHTML =
      '<div class="err">Couldn&rsquo;t load the latest notices (' + esc(msg) + '). Showing the last data loaded, if any.</div>';
  }

  function fetchData(isRefresh){
    var btn = document.getElementById("refreshBtn");
    if(isRefresh) btn.classList.add("spin");
    return fetch(DATA_URL + "?_=" + Date.now(), {cache:"no-store"})
      .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
      .then(function(json){
        document.getElementById("errBox").innerHTML = "";
        state.data = json;
        if(state.lastSeenId === 0) state.lastSeenId = loadLastSeen();
        document.getElementById("updatedAt").textContent = relTime(json.last_updated) + " (" + json.last_updated.replace("T"," ").replace("Z"," UTC") + ")";
        renderSubjectFilter(); renderList();
      })
      .catch(function(e){ showError(e.message); })
      .finally(function(){ if(isRefresh) btn.classList.remove("spin"); });
  }

  document.getElementById("refreshBtn").addEventListener("click", function(){ fetchData(true); });
  document.getElementById("loadMore").addEventListener("click", function(){
    state.shown += PAGE_SIZE; renderList();
  });
  var searchTimer;
  document.getElementById("search").addEventListener("input", function(e){
    clearTimeout(searchTimer);
    var v = e.target.value;
    searchTimer = setTimeout(function(){
      state.query = v; state.shown = PAGE_SIZE; renderList();
    }, 150);
  });
  document.getElementById("subjectFilter").addEventListener("change", function(e){
    state.subject = e.target.value; state.shown = PAGE_SIZE; renderList();
  });
  document.getElementById("ppoToggle").addEventListener("change", function(e){
    state.showPPO = e.target.checked; state.subject = ""; state.shown = PAGE_SIZE;
    renderSubjectFilter(); renderList();
  });

  // skeleton while first load is in flight
  document.getElementById("list").innerHTML = Array(4).fill('<div class="skel"></div>').join("");

  // -- Placement Opportunity table (mirrors the ERP application grid + its
  // job/company detail dialogs) --
  function formatINR(n){
    var s = String(n==null?'':n).replace(/[^\d]/g,'');
    if(!s) return String(n==null?'':n);
    var last3 = s.slice(-3), rest = s.slice(0,-3);
    if(rest) rest = rest.replace(/\B(?=(\d{2})+(?!\d))/g, ',') + ',';
    return rest + last3;
  }
  function fmtDateTime(s){
    // ERP gives "YYYY-MM-DD HH:MM" -- shown as DD-MM-YY with the time on its own line
    if(!s) return {date:'\u2014', time:''};
    var parts = String(s).split(' ');
    var d = (parts[0]||'').split('-');
    if(d.length !== 3) return {date: esc(s), time:''};
    return {date: d[2]+'-'+d[1]+'-'+d[0].slice(2), time: esc(parts[1]||'')};
  }
  function oppRow(c, idx){
    var expiry = c.resume_end ? new Date(c.resume_end.replace(' ','T')+':00+05:30') : null;
    var closed = expiry && !isNaN(expiry) && expiry < new Date();
    var hoursLeft = expiry ? (expiry - new Date())/36e5 : null;
    var urgent = !closed && hoursLeft!==null && hoursLeft < 24;
    var pillCls = c.is_applied===true?'status-applied':c.is_applied===false?'status-available':'status-loading';
    var pillTxt = c.is_applied===true?'Applied':c.is_applied===false?'Not applied':'Checking…';
    var desc = c.description || c.details || '';
    var detailId = 'oppdet'+idx;
    var opens = fmtDateTime(c.resume_start);
    var deadline = fmtDateTime(c.resume_end);
    var summary = '<tr class="opp-row">'+
      '<td><p class="opp-company">'+esc(c.company)+'</p><p class="opp-role">'+esc(c.role)+'</p></td>'+
      '<td class="mono">'+esc(formatINR(c.ctc))+'</td>'+
      '<td class="mono">'+esc(c.currency)+'</td>'+
      '<td class="mono">'+(c.cgpa_cutoff?esc(c.cgpa_cutoff)+'+':'&mdash;')+'</td>'+
      '<td><span class="status-pill '+pillCls+'">'+pillTxt+'</span></td>'+
      '<td class="mono" style="font-size:12.5px">'+opens.date+'<br><span style="color:var(--text-dim);font-size:11px">'+opens.time+'</span></td>'+
      '<td class="mono" style="font-size:12.5px'+((closed||urgent)?';color:var(--warn)':'')+'">'+deadline.date+'<br><span style="font-size:11px'+((closed||urgent)?'':';color:var(--text-dim)')+'">'+deadline.time+(closed?' (closed)':'')+'</span></td>'+
      '<td><button class="opp-toggle-btn" data-target="'+detailId+'">Details</button></td>'+
    '</tr>';
    var detail = '<tr class="opp-detail-row" id="'+detailId+'" hidden><td colspan="8"><div class="opp-detail">'+
      (desc?('<div class="opp-desc">'+linkify(desc)+'</div>'):'<p style="color:var(--text-dim)">Job description not yet captured by the scraper &mdash; use the Open ERP button above for now.</p>')+
      (c.eligibility_summary?'<p class="opp-eligibility-note">Eligibility: '+esc(c.eligibility_summary)+'</p>':'')+
      (c.eligibility_full?'<details><summary>Full eligible departments &amp; degrees</summary><pre>'+esc(c.eligibility_full)+'</pre></details>':'')+
      (c.company_details?'<details><summary>About the company</summary><pre>'+linkify(c.company_details)+'</pre></details>':'')+
    '</div></td></tr>';
    return summary + detail;
  }

  function renderJobTable(){
    var data = state.jobsData;
    var wrap = document.getElementById('jobsTableWrap');
    if(!data || !data.companies.length){
      wrap.innerHTML = '<p>No placement opportunities were listed in the last successful check.</p>';
      return;
    }
    wrap.innerHTML = '<a class="opp-global-open" href="https://erp.iitkgp.ac.in/IIT_ERP3/" target="_blank" rel="noopener noreferrer">Open ERP to apply, view full JD, or view an applied resume</a>'+
      '<div class="opp-table-wrap"><table class="opp-table"><thead><tr>'+
      '<th>Company &amp; role</th><th>CTC</th><th>Currency</th><th>CGPA</th><th>Status</th><th>Resume opens</th><th>Deadline</th><th></th>'+
      '</tr></thead><tbody>'+data.companies.map(oppRow).join('')+'</tbody></table></div>';
    Array.prototype.forEach.call(wrap.querySelectorAll('.opp-toggle-btn'), function(btn){
      btn.addEventListener('click', function(){
        var row = document.getElementById(btn.getAttribute('data-target'));
        row.hidden = !row.hidden;
        btn.textContent = row.hidden ? 'Details' : 'Hide';
      });
    });
  }

  function loadCompanies(){
    fetch('./companies.json?_='+Date.now(), {cache:'no-store'}).then(function(r){
      if(!r.ok) throw new Error('Company snapshot not yet available'); return r.json();
    }).then(function(data){
      state.jobsData = data;
      var timestamp = new Date(data.last_updated);
      var stale = Date.now() - timestamp.getTime() > 2*60*60*1000;
      document.getElementById('jobsUpdated').textContent = 'Last checked '+timestamp.toLocaleString('en-IN',{timeZone:'Asia/Kolkata'})+' IST'+(stale?' · Snapshot may be outdated; verify in ERP':'');
      renderJobTable();
    }).catch(function(){document.getElementById('jobsUpdated').textContent='Company details will appear after the next successful CDC sync.';});
  }

  renderSectionTabs();
  loadCompanies();
  fetchData(false);
  setInterval(function(){ fetchData(false); }, 5 * 60 * 1000);
})();
</script>
