name: Hourly CDC watcher
on:
  # Redundant triggers: cron-job.org (external, POSTs the dispatch API), GitHub's
  # own schedule (unreliable on its own -- it once went silent for 5+ hours --
  # but free extra chances) and a launchd job on the user's Mac that runs
  # `gh workflow run`. ANY of them may fire late, twice, or never; the "gate"
  # step (gate.py) lets a real cycle -- an ERP login -- run only if the last
  # success was 50+ min ago and the last attempt 25+ min ago, so redundancy
  # never means extra logins. Manual runs: `gh workflow run ... -f force=true`.
  workflow_dispatch:
    inputs:
      force:
        description: "Run now even if a cycle ran recently (manual testing only)"
        type: boolean
        default: false
  schedule:
    - cron: '7,22,37,52 * * * *'
permissions:
  contents: write
concurrency:
  group: hourly-watcher
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check if a run is actually due
        id: gate
        env:
          FORCE_RUN: ${{ inputs.force }}
        run: python3 gate.py
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.should_run == 'true'
        with:
          python-version: '3.12'
      - name: Install deps
        if: steps.gate.outputs.should_run == 'true'
        run: |
          pip install playwright requests
          python3 -m playwright install --with-deps chromium
      - name: Decrypt WhatsApp session
        id: wa_decrypt
        if: steps.gate.outputs.should_run == 'true'
        env:
          WA_PROFILE_KEY: ${{ secrets.WA_PROFILE_KEY }}
        run: |
          openssl enc -aes-256-cbc -pbkdf2 -d -in wa_profile.tar.gz.enc -out wa_profile.tar.gz -pass env:WA_PROFILE_KEY
          mkdir -p wa_profile
          tar -xzf wa_profile.tar.gz -C wa_profile
          rm -f wa_profile.tar.gz
      - name: Run hourly check + WhatsApp notify
        if: steps.gate.outputs.should_run == 'true'
        env:
          ERP_USER: ${{ secrets.ERP_USER }}
          ERP_PW: ${{ secrets.ERP_PW }}
          GMAIL: ${{ secrets.GMAIL }}
          APP_PW: ${{ secrets.APP_PW }}
          SECURITY_ANSWERS: ${{ secrets.SECURITY_ANSWERS }}
          WA_NUMBER: ${{ secrets.WA_NUMBER }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FORCE_RUN: ${{ inputs.force }}
        run: python3 cloud_hourly.py
      - name: Re-encrypt WhatsApp session (may have refreshed tokens)
        id: wa_encrypt
        if: always() && steps.wa_decrypt.outcome == 'success'
        env:
          WA_PROFILE_KEY: ${{ secrets.WA_PROFILE_KEY }}
        run: |
          # trim every regenerable Chromium cache dir -- the profile grows
          # unbounded run over run (each hourly send adds to WhatsApp Web's
          # own IndexedDB/cache) and hit GitHub's 100MB file limit on 24 Sep
          # 2026, which silently blocked the site/PDF commit below too since
          # they used to ship in the same commit (see "Commit site/state").
          # None of these dirs hold auth state -- only Cookies/Local
          # Storage/IndexedDB (untouched) do.
          rm -rf wa_profile/Default/"Code Cache" wa_profile/Default/Cache \
                 wa_profile/Default/"Cache Data" wa_profile/Default/GPUCache \
                 wa_profile/Default/DawnWebGPUCache wa_profile/Default/DawnGraphiteCache \
                 wa_profile/Default/GrShaderCache wa_profile/Default/ShaderCache \
                 wa_profile/Default/"Service Worker/CacheStorage" \
                 wa_profile/Default/"Service Worker/ScriptCache" \
                 wa_profile/Default/blob_storage \
                 wa_profile/GraphiteDawnCache wa_profile/component_crx_cache \
                 wa_profile/GrShaderCache wa_profile/ShaderCache \
                 wa_profile/Crashpad 2>/dev/null || true
          tar -czf wa_profile.tar.gz -C wa_profile .
          openssl enc -aes-256-cbc -pbkdf2 -salt -in wa_profile.tar.gz -out wa_profile.tar.gz.enc -pass env:WA_PROFILE_KEY
          rm -f wa_profile.tar.gz
          echo "encrypted WhatsApp session size: $(du -h wa_profile.tar.gz.enc | cut -f1)"
      - name: Commit + push site/state (never blocked by the WhatsApp session)
        if: steps.gate.outputs.should_run == 'true' && always()
        run: |
          git config user.name "placement-watcher-bot"
          git config user.email "actions@users.noreply.github.com"
          git add seen_notice_ids.json docs/ last_run.json 2>/dev/null || true
          git commit -m "chore: hourly update $(date -u +%Y-%m-%dT%H:%M:%SZ)" || echo "nothing to commit"
          # unattended-safe: someone may have pushed meanwhile; rebase then push, retry once
          git pull --rebase --autostash -q || true
          git push || (sleep 5 && git pull --rebase --autostash -q && git push)
      - name: Commit + push WhatsApp session (best-effort, kept separate on
          purpose -- an oversized/rejected session commit must never hold
          back the site/state commit above)
        if: always() && steps.wa_encrypt.outcome == 'success'
        run: |
          git add wa_profile.tar.gz.enc 2>/dev/null || true
          git commit -m "chore: re-encrypted WhatsApp session $(date -u +%Y-%m-%dT%H:%M:%SZ)" || echo "nothing to commit"
          git pull --rebase --autostash -q || true
          git push || (sleep 5 && git pull --rebase --autostash -q && git push) || echo "::warning::WhatsApp session push failed (likely still >100MB) -- next run reuses the last committed session, non-fatal"

      - name: Remove plaintext sessions from runner
        if: always()
        run: |
          rm -rf wa_profile wa_profile.tar.gz session_cookie.txt
